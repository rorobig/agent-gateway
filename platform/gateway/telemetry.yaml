# Gateway-wide observability. "frontend" policies apply to everything entering the Gateway.
# Note: only one policy of each kind should target the same resource (a second one silently wins).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: telemetry
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  frontend:
    metrics:
      attributes:
        add:
          # Every metric (requests, tokens, latency...) gets a "user" label from the caller's API key.
          # Requests without a key (llm.localhost, pirate.localhost) get "anonymous".
          - name: user
            expression: 'has(apiKey.user_id) ? apiKey.user_id : "anonymous"'
    accessLog:
      attributes:
        add:
          - name: user
            expression: 'apiKey.user_id'
          - name: tokens.in
            expression: 'llm.inputTokens'
          - name: tokens.out
            expression: 'llm.outputTokens'
