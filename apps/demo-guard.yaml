apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-guard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/rorobig/agent-gateway.git
    targetRevision: main
    path: demos/guard
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
