# Demo 6: an agent that changes the cluster.  ./scripts/demo.sh break, then ./scripts/demo.sh fix
#
# Same Kubernetes tool server (MCP) as cluster-reader, plus one tool that writes: rollout (undo).
# It's only told to stay in the playground namespace; nothing enforces that yet (see README "Next").
#
# Its own API key (sk-fixer, tier pro -> qwen3.5:9b): changing things takes several correct tool calls
# in a row, and qwen2.5:7b got about half of those runs wrong. It also gets its own line on the dashboard.
apiVersion: v1
kind: Secret
metadata:
  name: fixer-key
stringData:
  OPENAI_API_KEY: sk-fixer
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: fixer-model
spec:
  provider: OpenAI
  model: smart                     # ignored: the gateway picks the model from the key's tier
  apiKeySecret: fixer-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://api.ai.svc.cluster.local/v1
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: fixer
spec:
  description: Finds why an app in the playground namespace is broken and rolls back the bad deploy.
  type: Declarative
  declarative:
    modelConfig: fixer-model
    systemMessage: |
      You are an on-call Kubernetes engineer. You only work in the "playground" namespace.
      Work in this order, calling one tool per step:
      1. k8s_get_resources with resource_type "pod", namespace "playground": find pods that are not Running.
      2. k8s_describe_resource on one failing pod: read its Image and Events to find the cause.
      3. If a recent deploy broke it (for example a wrong image), roll the deployment back:
         k8s_rollout with action "undo", resource_type "deployment", namespace "playground", and the
         deployment name. The deployment name is the pod name without its last two parts:
         pod "api-5d9c7b8f4-x2kqp" belongs to deployment "api".
      4. k8s_get_resources with resource_type "pod" again, to check the new pods are starting.
      Then answer in at most four short lines: what was wrong, what you did, and the result.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_rollout
    a2aConfig:
      skills:
        - id: fix-playground
          name: Fix the playground
          description: Diagnoses and fixes a broken app in the playground namespace.
          tags: [kubernetes, fix]
          examples:
            - "The shop in the playground namespace is down. Fix it."
