# The agents' tool calls (MCP) through agentgateway too, not only their LLM calls.
#
#   agent ──MCP──▶ tools.kagent.svc.cluster.local (agentgateway) ──MCP──▶ kagent-tools ──▶ Kubernetes
#
# Each agent sends its own API key, so the gateway knows WHO calls WHICH tool: it's in the access log
# (./scripts/demo.sh logs) and a missing or unknown key gets a 401 before any tool runs.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: k8s-tools
spec:
  mcp:
    targets:
      - name: k8s
        static:
          backendRef:
            name: kagent-tools       # kagent's own tool server (Kubernetes, Helm, ... tools)
          port: 8084
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tools
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - tools.kagent.svc.cluster.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: k8s-tools
          weight: 1
---
# In-cluster DNS name for the route above: tools.kagent.svc.cluster.local -> the gateway proxy.
apiVersion: v1
kind: Service
metadata:
  name: tools
spec:
  type: ExternalName
  externalName: agentgateway-proxy.agentgateway-system.svc.cluster.local
---
# No key, no tools. The same keys the agents use for their LLM calls (demos/03-company/keys.yaml).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tools-access
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tools
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: tool-keys
---
# Which agent may call which tool. Anything not listed is denied: the agent doesn't even see the tool.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tools-per-agent
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: k8s-tools
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'apiKey.user_id == "kagent" && mcp.tool.name in ["k8s_get_resources", "k8s_describe_resource", "k8s_get_events", "k8s_get_pod_logs"]'
            - 'apiKey.user_id == "fixer" && mcp.tool.name in ["k8s_get_resources", "k8s_describe_resource", "k8s_rollout"]'
---
apiVersion: v1
kind: Secret
metadata:
  name: tool-keys
stringData:
  kagent: '{"key": "sk-kagent", "metadata": {"user_id": "kagent"}}'
  fixer: '{"key": "sk-fixer", "metadata": {"user_id": "fixer"}}'
---
# What the agents point at: the gateway, one per agent identity (the header carries its key).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: tools-as-kagent
spec:
  description: Kubernetes tools via agentgateway, as user kagent
  protocol: STREAMABLE_HTTP
  url: http://tools.kagent.svc.cluster.local/mcp
  headersFrom:
    - name: Authorization
      value: Bearer sk-kagent
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: tools-as-fixer
spec:
  description: Kubernetes tools via agentgateway, as user fixer
  protocol: STREAMABLE_HTTP
  url: http://tools.kagent.svc.cluster.local/mcp
  headersFrom:
    - name: Authorization
      value: Bearer sk-fixer
