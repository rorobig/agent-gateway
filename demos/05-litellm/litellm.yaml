# Demo 5: LiteLLM, for comparison.  http://litellm.localhost/v1/chat/completions
#
# The same job as demo 1 (OpenAI API in front of Ollama, 'fast'/'smart' aliases), done by LiteLLM:
# a Python proxy configured with its own config file instead of Kubernetes resources.
# agentgateway only routes traffic to it here (plain HTTP); LiteLLM does the LLM part.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: fast
        litellm_params:
          model: ollama_chat/qwen2.5:1.5b
          api_base: http://host.k3d.internal:11434
      - model_name: smart
        litellm_params:
          model: ollama_chat/qwen2.5:7b
          api_base: http://host.k3d.internal:11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels: { app: litellm }
  template:
    metadata:
      labels: { app: litellm }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.2
          args: ["--config", "/config/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: litellm }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector: { app: litellm }
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - litellm.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: litellm
          port: 4000
          weight: 1
