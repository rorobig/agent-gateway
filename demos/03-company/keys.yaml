# Demo 3: "virtual keys". Each caller gets their own API key; the gateway knows who is calling.
# The metadata is available in every policy as CEL: apiKey.user_id, apiKey.tier.
# (Demo keys in plain text on purpose. In real life: hashed keys, or JWTs from your IdP.)
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
stringData:
  alice: '{"key": "sk-alice", "metadata": {"user_id": "alice", "tier": "pro"}}'
  bob: '{"key": "sk-bob", "metadata": {"user_id": "bob", "tier": "pro"}}'
  intern: '{"key": "sk-intern", "metadata": {"user_id": "intern", "tier": "free"}}'
  kagent: '{"key": "sk-kagent", "metadata": {"user_id": "kagent", "tier": "agent"}}'   # the agents (demo 4)
  fixer: '{"key": "sk-fixer", "metadata": {"user_id": "fixer", "tier": "pro"}}'      # the fixer agent (demo 6)
