# Demo 3: the company AI endpoint.  http://api.localhost   (needs: Authorization: Bearer sk-<user>)
#
# Request path:  API key? -> token budget left? -> pick model by tier -> guards -> Ollama -> guards -> caller
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: company
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - api.localhost
    - api.ai.svc.cluster.local     # the same endpoint from inside the cluster (kagent uses it)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: company
          weight: 1
---
# Who may call, and how many tokens they may burn. One traffic policy per route (a second one would silently win).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: company-access
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: company
  traffic:
    apiKeyAuthentication:
      mode: Strict                 # no key / wrong key -> 401, the model is never called
      secretRef:
        name: api-keys
    rateLimit:
      # Budgets are counted in TOKENS, not requests: one long answer costs more than ten short ones.
      # The first matching condition wins; the last entry (no condition) is everyone else.
      conditional:
        - condition: 'apiKey.tier == "free"'
          policy:
            local:
              - tokens: 400
                unit: Minutes
        - policy:
            local:
              - tokens: 20000
                unit: Minutes
---
# In-cluster DNS name for this endpoint: api.ai.svc.cluster.local -> the gateway proxy.
# Pods can't use api.localhost (that's their own loopback), so they use this name instead.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ExternalName
  externalName: agentgateway-proxy.agentgateway-system.svc.cluster.local
