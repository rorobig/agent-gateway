# Demo 6: the victim. A tiny web shop at http://shop.localhost that the fixer agent repairs.
#
# Applied by ./scripts/demo.sh break, deliberately NOT by Argo CD: Argo self-heals everything it manages,
# so it would undo both the breakage and the agent's fix.
apiVersion: v1
kind: Namespace
metadata:
  name: playground
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: playground
spec:
  replicas: 2
  strategy:
    type: Recreate            # a bad image takes every pod down, not just the new one
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: playground
spec:
  selector: { app: shop }
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: playground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - shop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: shop
          port: 80
          weight: 1
